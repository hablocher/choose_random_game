[CONFIG]
# Pasta raiz/base para atalhos de jogos
baseLinks = C:/Users/Marcelo/Desktop/
# Extensão esperada para atalhos do Windows
shortcutExt = .lnk
# Se ativado, seleciona com preferência jogos marcados como favoritos
onlyFavorites = False
# Salva automaticamente jogos catalogados na base de dados
importContentToDatabase = True
# Incluir atalhos presentes diretamente na Área de Trabalho (Desktop)
includeDesktop = True
# Caminho da Área de Trabalho
desktopPath = C:/Users/Marcelo/Desktop
# Quantidade de jogos sorteados na amostra para desempate do menos jogado
randomSampleSize = 25
# Distância máxima de Levenshtein para correspondência de executáveis
levenshteinMaxDistance = 2
# Limiar mínimo de similaridade Jaro-Winkler para correspondência de executáveis
jaroWinklerThreshold = 0.85
# Prefixo de identificação interna de atalhos
linkPrefix = link::
# Pasta local para cache de capas de jogos baixadas
coversCacheDir = covers_cache
# Habilitar busca online de capas na Steam Store / APIs públicas
fetchOnlineCovers = True

[DATABASE]
# Configurações de conexão com o banco de dados (SQLite, MySQL, MSSQL)
server    = localhost
user      = sa
password  = 
name      = AesgardGames
type      = sqlite
# Nome da tabela de jogos no banco
tableName = GamesChoosed

[DOSBOX]
# Caminho da instalação do emulador DOSBox
DOSBOXLocation   = C:/Program Files (x86)/DOSBox-0.74
DOSBOXExecutable = DOSBox.exe
DOSBOXParameters = -userconf -c {} -c _run.bat

[EXODOS]
# Caminho da pasta eXoDOS
EXODOSLocation   = G:/eXoDOS_Lite/eXo/eXoDOS
# Imagem fallback caso o jogo não possua arte local
EXODOSImageURL   = https://i.etsystatic.com/isla/af42a4/47274617/isla_280x280.47274617_dutjcs48.jpg?version=0
# Pasta interna que contém os metadados e scripts de catálogo geral da eXoDOS
metadataFolder   = !dos
# Nome do script de instalação/download a ser ignorado ao localizar o launcher
installBat       = install.bat
# Considerar apenas jogos baixados/instalados na pasta raiz da eXoDOS
onlyInstalled    = True
# Prefixo de identificação interna de jogos eXoDOS
exodosPrefix     = exodos:

[PLAYNITE]
# Integração com o Playnite (unifica Steam, GOG, Epic Games, EA, Ubisoft, etc.)
enabled          = True
# Caminho de instalação ou diretório de dados do Playnite (se vazio, tenta detectar automaticamente)
path             = C:/Users/Marcelo/AppData/Local/Playnite
# Considerar apenas jogos instalados no Playnite (False para incluir todo o catálogo de emuladores e backlog)
onlyInstalled    = False
# Arquivo JSON exportado da biblioteca Playnite (export_playnite_library.ps1)
exportJson       = playnite_games.json
# Protocolo URI usado para disparar a execução do jogo no Playnite
uriPrefix        = playnite://playnite/start/
# Subpasta onde o Playnite armazena capas e ícones
libraryFilesDir  = library/files
# Prefixo de identificação interna de jogos do Playnite
playnitePrefix   = playnite:

[GOG]
# Habilitar integração direta e busca de capas no catálogo GOG quando o Playnite não tiver
enabled          = True
# Caminho da base de dados do GOG Galaxy (opcional)
galaxyDbPath     = 

[STEAM]
# Habilitar integração direta e busca de capas na Steam Storefront quando o Playnite não tiver
enabled          = True
# Caminho de instalação da Steam (opcional)
steamPath        = C:/Program Files (x86)/Steam

[UI]
# Configurações visuais do Modern Gaming Dashboard (PyQt6)
windowWidth  = 1180
windowHeight = 740
minWidth     = 960
minHeight    = 600
# Quantidade máxima de jogos carregados inicialmente na tabela
tableLimit   = 400
# Largura e altura da imagem de capa (pixels)
coverWidth   = 160
coverHeight  = 160

[FILES]
# Exportação de arquivos de texto com lista de jogos encontrados
createFiles         = True
pathToSave          = C:/Users/Marcelo/Desktop/
gamesFoundFileName  = GameFoldersFound.txt

[GAMEFOLDERS]
# Pastas do disco contendo instalações locais de jogos
path1 = D:/Jogos
path2 = E:/Jogos
path3 = F:/Jogos
path4 = G:/Jogos
path5 = H:/Jogos
path6 = I:/Jogos
path7 = J:/Jogos
path8 = K:/Jogos
path9 = D:/UE
path10 = E:/JOGOS/DOSBOX
path11 = I:/Origin Games
path12 = G:/eXoDOS_Lite/eXo/eXoDOS
path13 = D:/Amazon Games/Library
path14 = E:/Amazon Games/Library
path15 = F:/Amazon Games/Library
path16 = G:/Amazon Games/Library
path17 = H:/Amazon Games/Library
path18 = I:/Amazon Games/Library
path19 = J:/Amazon Games/Library
path20 = K:/Amazon Games/Library

[GAMECOMMONFOLDERS]
# Subpastas comuns dentro de cada pasta de jogos
path1 = /GOG Games/
path2 = /gog games/
path3 = /GOG.com/
path4 = /

[FOLDERSWITHLINKS]
# Subpastas de atalhos a serem varridas recursivamente
folder1 = Games
folder2 = GOG
folder3 = Origin
folder4 = Steam
folder5 = EPIC
folder6 = UPlay

[REMOVALS]
# Termos e substrings a serem removidos/filtrados
path1 = UE_
path2 = MMO
path3 = DONE
path4 = .url
path5 = steamapps
path6 = Steam
path7 = SteamVR
path8 = .DS_Store
path9 = steam.dll
path10 = Twitch
path11 = localdata
PATH12 = GOG.com
PATH13 = DOSBOX
PATH14 = !dos
PATH15 = __InstallData__

[ENDSWITH]
# Ignorar pastas que terminam com estas extensões/termos
path1 = gog.com
path2 = gog games
path3 = __installdata__

[LAUNCHERPREFIXES]
# Prefixos de atalhos e executáveis de inicialização do jogo
launch1 = Launch
launch2 = Play
launch3 = Iniciar

[OTHERCLIENTS]
# Protocolos de launchers terceiros para atalhos
client1 = amazon-games://
client2 = com.epicgames.launcher://
client3 = uplay://
client4 = steam://

[STREAMER]
# Habilitar animação de Roleta/Slot Machine com suspense antes de revelar o jogo sorteado
rouletteEnabled = True
# Duração em milissegundos da animação da Roleta
rouletteDurationMs = 2600
# Modo de cor padrão da janela Overlay do OBS: 'dark', 'green' (Chroma Key) ou 'magenta'
overlayChromaKey = dark
# Canal Principal no YouTube (Vídeos, análises e tutoriais)
youtubeMainChannel = https://www.youtube.com/@SeuCanalPrincipal
# Canal Secundário no YouTube (Transmissões ao vivo e gameplays)
youtubeLiveChannel = https://www.youtube.com/@SeuCanalDeLives

[THEME]
# Imagem de fundo temática de Caninos Brancos (Jack London).
# Presets disponíveis:
#   assets/backgrounds/caninos_brancos_lpm.png       (Edição L&PM Pocket original)
#   assets/backgrounds/white_fang_boreal_aurora.jpg  (Edição Boreal & Aurora do Yukon)
#   assets/backgrounds/white_fang_classic_1906.jpg   (Edição Clássica 1906 Macmillan)
# Ou qualquer caminho absoluto/relativo para outra imagem
backgroundImage = assets/backgrounds/caninos_brancos_lpm.png
# Opacidade da arte de fundo (0.05 a 0.40 para leitura ideal de textos e cards)
backgroundOpacity = 0.22
# Efeitos sonoros temáticos de Caninos Brancos (uivo de lobo, nevasca, passos na neve)
themeSounds = True

 
